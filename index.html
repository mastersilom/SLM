<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLM Foundation</title>

  <link rel="apple-touch-icon" href="https://img1.pic.in.th/images/Logo3833da7ae4a5153c.png">
  <link rel="icon" type="image/png" href="https://img1.pic.in.th/images/Logo3833da7ae4a5153c.png">

  <style>
    /* ตั้งค่าให้หน้าเว็บแสดงผลเต็มพื้นที่ 100% ไม่มีขอบ */
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #1A2B4C; 
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
  </style>
</head>
<body>

  <iframe id="gas-frame" src="https://script.google.com/macros/s/AKfycbxAq33RY9-xhK7BmpnYyeYd_5tnhsEK3rpB79oyKf3zGZd-rfoATz03uQUNRVfGJMi4Eg/exec" allow="geolocation *; microphone; camera; display-capture"></iframe>

  <script>
    // ระบบดักฟังคำสั่งขอ GPS จาก Google Apps Script
    window.addEventListener('message', function(event) {
      if (event.data === 'request_gps') {
        
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function(position) {
              // ส่งพิกัดกลับไปให้ Google Apps Script โดยตรง
              event.source.postMessage({
                action: 'gps_success',
                lat: position.coords.latitude,
                lng: position.coords.longitude
              }, '*');
            },
            function(error) {
              let msg = "เกิดข้อผิดพลาดในการดึงพิกัด";
              if (error.code === 1) msg = "คุณยังไม่ได้อนุญาตให้เข้าถึง GPS";
              if (error.code === 2) msg = "สัญญาณ GPS ขัดข้อง";
              if (error.code === 3) msg = "หมดเวลาการค้นหาพิกัด (Timeout)";
              
              event.source.postMessage({ action: 'gps_error', message: msg }, '*');
            },
            // บังคับความแม่นยำสูง
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 } 
          );
        } else {
          event.source.postMessage({ action: 'gps_error', message: 'เบราว์เซอร์ไม่รองรับ GPS' }, '*');
        }
      }
    });
  </script>

</body>
</html>
