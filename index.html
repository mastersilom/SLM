<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLM Foundation</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #F3F4F6; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <iframe id="gas-frame" src="https://script.google.com/macros/s/AKfycbxo1KC6xJEte-v6zZuan5qwRicWA7BvtZlR0v07CoIdueP8pnEHxOBu_a6qEfSU3m1emA/exec"></iframe>

  <script>
    window.addEventListener('message', function(event) {
      // ดักฟังคำสั่งว่า Apps Script ขอ GPS หรือไม่
      if (event.data === 'request_gps') {
        
        // ถ้าเบราว์เซอร์รองรับ GPS
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function(position) {
              // ดึงพิกัดสำเร็จ -> ส่งข้อมูลพิกัดกลับไปให้ Apps Script
              const gpsData = {
                action: 'gps_success',
                lat: position.coords.latitude,
                lng: position.coords.longitude
              };
              document.getElementById('gas-frame').contentWindow.postMessage(gpsData, '*');
            },
            function(error) {
              // ถ้าผู้ใช้กดไม่อนุญาต หรือหาไม่เจอ -> ส่ง Error กลับไป
              document.getElementById('gas-frame').contentWindow.postMessage({ 
                action: 'gps_error', 
                message: error.message 
              }, '*');
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 } 
          );
        } else {
          document.getElementById('gas-frame').contentWindow.postMessage({ 
            action: 'gps_error', 
            message: 'อุปกรณ์ไม่รองรับ GPS' 
          }, '*');
        }
      }
    });
  </script>

</body>
</html>
