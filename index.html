<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLM Foundation</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #F3F4F6; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <iframe id="gas-frame" src="https://script.google.com/macros/s/AKfycbxo1KC6xJEte-v6zZuan5qwRicWA7BvtZlR0v07CoIdueP8pnEHxOBu_a6qEfSU3m1emA/exec" allow="geolocation *; microphone; camera"></iframe>

  <script>
    window.addEventListener('message', function(event) {
      if (event.data === 'request_gps') {
        
        // เช็คว่ามือถือรองรับ GPS ไหม
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function(position) {
              // ถ้าสำเร็จ ส่งพิกัดกลับไป
              document.getElementById('gas-frame').contentWindow.postMessage({
                action: 'gps_success',
                lat: position.coords.latitude,
                lng: position.coords.longitude
              }, '*');
            },
            function(error) {
              // แปลงรหัส Error ให้เข้าใจง่าย
              let msg = "เกิดข้อผิดพลาดในการดึงพิกัด";
              if (error.code === 1) msg = "ผู้ใช้งานไม่อนุญาตให้เข้าถึง GPS";
              if (error.code === 2) msg = "สัญญาณ GPS ขัดข้อง หรืออยู่ในจุดอับสัญญาณ";
              if (error.code === 3) msg = "หมดเวลาการค้นหาพิกัด (Timeout)";
              
              document.getElementById('gas-frame').contentWindow.postMessage({ 
                action: 'gps_error', 
                message: msg 
              }, '*');
            },
            // บังคับใช้ความแม่นยำสูงสุด และรอได้สูงสุด 15 วินาที
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 } 
          );
        } else {
          document.getElementById('gas-frame').contentWindow.postMessage({ 
            action: 'gps_error', 
            message: 'เบราว์เซอร์นี้ไม่รองรับระบบพิกัด GPS' 
          }, '*');
        }
      }
    });
  </script>

</body>
</html>
