  <title>SLM Foundation</title>
  <style>
    /* ตั้งค่าไม่ให้มีขอบ และให้แสดงผลเต็มหน้าจอ 100% */

      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F3F4F6;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
